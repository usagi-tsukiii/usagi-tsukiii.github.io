<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Usako OBS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; width: 100vw; height: 100vh; overflow: hidden; position: relative; font-family: sans-serif; }
  .overlay-el { position: absolute; border-radius: 8px; max-width: 80vw; max-height: 80vh; pointer-events: none; }
  #error {
    display: none; position: fixed; inset: 0; background: #0d0f14;
    color: #eaeaf5; padding: 40px; z-index: 9999; font-family: sans-serif;
  }
  #error h2 { color: #e17055; margin-bottom: 12px; }
  #error p { color: #7c82a0; font-size: 14px; line-height: 1.6; }
  #status { position: fixed; bottom: 10px; left: 10px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.25); pointer-events: none; }
</style>
</head>
<body>
<div id="error">
  <h2>⚠ Usako OBS — No URL Data</h2>
  <p>This browser source URL is missing its configuration.<br><br>
  Go to your <strong>Usako bot page → Settings → OBS Browser Source</strong> and click <strong>Generate</strong> to create a fresh URL, then paste it here.</p>
</div>
<div id="container"></div>
<div id="status">Usako OBS — loading...</div>

<script>
  // ── LOAD CONFIG FROM URL HASH ─────────────────────────────────────────────
  function loadConfig() {
    try {
      const hash = location.hash.substring(1);
      if (!hash) return null;
      const json = decodeURIComponent(escape(atob(hash)));
      return JSON.parse(json);
    } catch(e) {
      setStatus('error decoding config: ' + e.message);
      return null;
    }
  }

  // ── MEDIA ─────────────────────────────────────────────────────────────────
  function playSound(action, mediaLib) {
    const file = (mediaLib.sounds || []).find(s => s.id === action.fileId);
    if (!file) { setStatus('⚠ sound not found'); return; }
    const audio = new Audio(file.b64);
    audio.volume = action.volume !== undefined ? Math.min(1, Math.max(0, parseFloat(action.volume))) : 1;
    audio.play().then(() => setStatus('♪ playing sound')).catch(e => setStatus('sound blocked: ' + e.message));
  }

  function showOverlay(action, mediaLib) {
    const file = (mediaLib.overlays || []).find(o => o.id === action.fileId);
    if (!file) { setStatus('⚠ overlay not found'); return; }
    const container = document.getElementById('container');
    const el = file.mime.startsWith('video') ? document.createElement('video') : document.createElement('img');
    el.src = file.b64;
    el.className = 'overlay-el';
    if (action.width) el.style.width = action.width + 'px';
    const pos = action.position || 'center';
    if      (pos === 'center')        Object.assign(el.style, { top:'50%', left:'50%', transform:'translate(-50%,-50%)' });
    else if (pos === 'top-left')      Object.assign(el.style, { top:'20px', left:'20px' });
    else if (pos === 'top-right')     Object.assign(el.style, { top:'20px', right:'20px' });
    else if (pos === 'bottom-left')   Object.assign(el.style, { bottom:'20px', left:'20px' });
    else if (pos === 'bottom-right')  Object.assign(el.style, { bottom:'20px', right:'20px' });
    else if (pos === 'top-center')    Object.assign(el.style, { top:'20px', left:'50%', transform:'translateX(-50%)' });
    else if (pos === 'bottom-center') Object.assign(el.style, { bottom:'20px', left:'50%', transform:'translateX(-50%)' });
    if (el.tagName === 'VIDEO') { el.autoplay = true; el.muted = false; el.loop = action.duration === 0; }
    container.appendChild(el);
    setStatus('🖼 showing overlay');
    const dur = action.duration !== undefined ? action.duration : 3000;
    if (dur > 0) setTimeout(() => el.remove(), dur);
  }

  // ── COMMANDS ──────────────────────────────────────────────────────────────
  function buildTriggers(cmd) {
    const raw = (cmd.triggers || '').trim().split(/\s+/).filter(Boolean);
    if (!raw.length) raw.push(cmd.name);
    return (cmd.autoExclaim !== false ? raw.map(t => '!' + t) : raw).map(t => t.toLowerCase());
  }

  function checkTrigger(text, config) {
    const lower = text.trim().toLowerCase();
    (config.commands || []).forEach(cmd => {
      if (cmd.enabled === false) return;
      for (const trigger of buildTriggers(cmd)) {
        const matched = cmd.wildcards ? lower.startsWith(trigger) : lower.split(/\s+/)[0] === trigger;
        if (matched) {
          setStatus('▶ ' + cmd.name);
          (cmd.actions || []).forEach(action => {
            if (action.type !== 'sound' && action.type !== 'overlay') return;
            setTimeout(() => {
              if (action.type === 'sound') playSound(action, config.mediaLib);
              if (action.type === 'overlay') showOverlay(action, config.mediaLib);
            }, action.delay || 0);
          });
          break;
        }
      }
    });
  }

  // ── IRC ───────────────────────────────────────────────────────────────────
  let socket = null;

  function startBot(config) {
    setStatus('connecting to #' + config.channel + '...');
    if (socket) { try { socket.close(); } catch(e) {} socket = null; }
    socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    socket.onopen = () => {
      if (config.token) {
        socket.send('PASS oauth:' + config.token);
        socket.send('NICK ' + config.channel);
      } else {
        socket.send('PASS SCHMOOPIIE');
        socket.send('NICK justinfan' + Math.floor(Math.random() * 99999));
      }
      socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      socket.send('JOIN #' + config.channel);
    };
    socket.onmessage = e => {
      e.data.split('\r\n').filter(Boolean).forEach(line => {
        if (line.startsWith('PING')) { socket.send('PONG :tmi.twitch.tv'); return; }
        let rest = line;
        if (line.startsWith('@')) { const sp = line.indexOf(' '); rest = line.substring(sp + 1); }
        const parts = rest.split(' ');
        if (parts[0].startsWith(':')) parts.shift();
        const cmd = parts.shift();
        const params = parts.join(' ');
        if (cmd === '001' || cmd === '376') setStatus('✓ connected to #' + config.channel);
        if (cmd === 'PRIVMSG') {
          const m = params.match(/^#\S+ :(.*)/);
          if (m) checkTrigger(m[1], config);
        }
      });
    };
    socket.onclose = () => {
      setStatus('disconnected — retrying in 10s...');
      setTimeout(() => startBot(config), 10000);
    };
    socket.onerror = () => setStatus('connection error');
  }

  // ── AUDIO UNLOCK ──────────────────────────────────────────────────────────
  function unlockAudio() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start(0);
    } catch(e) {}
  }
  unlockAudio();
  if (window.obsstudio) window.obsstudio.onActiveChange = a => { if (a) unlockAudio(); };
  document.addEventListener('click', unlockAudio, { once: true });

  // ── STATUS ────────────────────────────────────────────────────────────────
  function setStatus(msg) { document.getElementById('status').textContent = 'Usako OBS — ' + msg; }

  // ── BOOT ─────────────────────────────────────────────────────────────────
  const config = loadConfig();
  if (!config || !config.channel) {
    document.getElementById('error').style.display = 'block';
    setStatus('no config in URL');
  } else {
    startBot(config);
  }
</script>
</body>
</html>
