<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Usako OBS Source - Tokenless Safe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  .overlay-el {
    position: absolute;
    border-radius: 8px;
    max-width: 80vw;
    max-height: 80vh;
    pointer-events: none;
    z-index: 10;
  }
  #status {
    position: fixed;
    left: 10px;
    bottom: 10px;
    z-index: 9999;
    font-family: monospace;
    font-size: 12px;
    color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.4);
    padding: 6px 8px;
    border-radius: 6px;
    pointer-events: none;
  }
  #audio-unlock {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: rgba(0,0,0,.72);
    color: white;
    font-family: sans-serif;
    place-items: center;
    text-align: center;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="container"></div>
<div id="status">Usako OBS — loading...</div>
<div id="audio-unlock">Click once to enable audio preview<br><small>OBS/Streamlabs usually do not need this.</small></div>

<script>
const STORE_KEY = 'usako_v1';
const OBS_KEY = 'usako_obs_config';

let config = null;
let socket = null;
let lastTriggerTime = 0;

function setStatus(msg) {
  document.getElementById('status').textContent = 'Usako OBS — ' + msg;
  console.log('[Usako OBS]', msg);
}

function safeJsonParse(value, fallback = null) {
  try { return JSON.parse(value); } catch (e) { return fallback; }
}

function base64UrlDecode(str) {
  const padded = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function normalizeConfig(raw) {
  if (!raw) return null;

  if (raw.streamer) {
    return {
      channel: raw.streamer.name || '',
      commands: raw.commands || [],
      mediaLib: raw.mediaLib || { sounds: [], overlays: [] }
    };
  }

  return {
    channel: raw.channel || '',
    commands: raw.commands || [],
    mediaLib: raw.mediaLib || { sounds: [], overlays: [] }
  };
}

async function loadConfig() {
  const params = new URLSearchParams(location.search);

  // SAFE Streamlabs mode:
  // obs.html?channel=name
  // obs.html?channel=name&config=https://your-site.com/usako-config.json
  // obs.html?cfg=smallEncodedConfig
  if (params.get('config')) {
    const url = params.get('config');
    setStatus('loading hosted config...');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('hosted config failed: ' + res.status);
    return normalizeConfig(await res.json());
  }

  if (params.get('cfg')) {
    return normalizeConfig(safeJsonParse(base64UrlDecode(params.get('cfg'))));
  }

  const channel = params.get('channel');
  if (channel) {
    return normalizeConfig({
      channel: channel.toLowerCase(),
      commands: [],
      mediaLib: { sounds: [], overlays: [] }
    });
  }

  // Normal browser/OBS testing mode: read localStorage from same browser.
  const appState = safeJsonParse(localStorage.getItem(STORE_KEY));
  if (appState) return normalizeConfig(appState);

  const obsState = safeJsonParse(localStorage.getItem(OBS_KEY));
  if (obsState) return normalizeConfig(obsState);

  return null;
}

function refreshConfigFromPayload(payload) {
  if (payload && payload.state) {
    config = normalizeConfig(payload.state);
  }
}

function getMediaSource(file) {
  return file.url || file.b64 || file.src || '';
}

function showAudioUnlock() {
  document.getElementById('audio-unlock').style.display = 'grid';
}

function unlockAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) {}
  document.getElementById('audio-unlock').style.display = 'none';
}

function playSound(action) {
  const sounds = (config && config.mediaLib && config.mediaLib.sounds) || [];
  const file = sounds.find(s => String(s.id) === String(action.fileId));

  if (!file) return setStatus('sound not found: ' + action.fileId);

  const src = getMediaSource(file);
  if (!src) return setStatus('sound has no url/b64');

  try {
    const audio = new Audio(src);
    audio.volume = action.volume !== undefined ? Math.min(1, Math.max(0, Number(action.volume))) : 1;

    const promise = audio.play();
    if (promise && promise.catch) {
      promise
        .then(() => setStatus('♪ sound: ' + (file.name || file.id)))
        .catch(err => {
          console.error(err);
          setStatus('sound blocked — click source once');
          showAudioUnlock();
        });
    }
  } catch (err) {
    setStatus('sound error: ' + err.message);
  }
}

function showOverlay(action) {
  const overlays = (config && config.mediaLib && config.mediaLib.overlays) || [];
  const file = overlays.find(o => String(o.id) === String(action.fileId));

  if (!file) return setStatus('overlay not found: ' + action.fileId);

  const src = getMediaSource(file);
  if (!src) return setStatus('overlay has no url/b64');

  const container = document.getElementById('container');
  const mime = file.mime || '';
  const el = mime.startsWith('video') ? document.createElement('video') : document.createElement('img');

  el.src = src;
  el.className = 'overlay-el';

  if (action.width && Number(action.width) > 0) el.style.width = action.width + 'px';

  const pos = action.position || 'center';
  if (pos === 'center')             Object.assign(el.style, { top:'50%', left:'50%', transform:'translate(-50%,-50%)' });
  else if (pos === 'top-left')      Object.assign(el.style, { top:'20px', left:'20px' });
  else if (pos === 'top-right')     Object.assign(el.style, { top:'20px', right:'20px' });
  else if (pos === 'bottom-left')   Object.assign(el.style, { bottom:'20px', left:'20px' });
  else if (pos === 'bottom-right')  Object.assign(el.style, { bottom:'20px', right:'20px' });
  else if (pos === 'top-center')    Object.assign(el.style, { top:'20px', left:'50%', transform:'translateX(-50%)' });
  else if (pos === 'bottom-center') Object.assign(el.style, { bottom:'20px', left:'50%', transform:'translateX(-50%)' });

  el.onerror = () => setStatus('overlay failed to load');
  el.onload = () => setStatus('🖼 overlay: ' + (file.name || file.id));

  if (el.tagName === 'VIDEO') {
    el.autoplay = true;
    el.muted = false;
    el.loop = action.duration === 0;
    el.playsInline = true;
    el.onloadeddata = () => setStatus('🎬 video: ' + (file.name || file.id));
    el.play().catch(err => {
      console.error(err);
      setStatus('video blocked — click source once');
      showAudioUnlock();
    });
  }

  container.appendChild(el);

  const duration = action.duration !== undefined ? Number(action.duration) : 3000;
  if (duration > 0) setTimeout(() => el.remove(), duration);
}

function runAction(action) {
  if (!action || !action.type) return;
  if (action.type === 'sound') playSound(action);
  if (action.type === 'overlay') showOverlay(action);
}

function receivePayload(payload) {
  if (!payload || !payload.action) return;
  if (payload.t && payload.t <= lastTriggerTime) return;
  lastTriggerTime = payload.t || Date.now();
  refreshConfigFromPayload(payload);
  runAction(payload.action);
}

window.addEventListener('storage', e => {
  if (e.key !== 'usako_obs_trigger' || !e.newValue) return;
  receivePayload(safeJsonParse(e.newValue));
});

try {
  const bc = new BroadcastChannel('usako_obs');
  bc.onmessage = e => receivePayload(e.data);
} catch (e) {}

setInterval(() => {
  const stored = safeJsonParse(localStorage.getItem('usako_obs_trigger'));
  if (stored) receivePayload(stored);
}, 750);

function buildTriggers(cmd) {
  const raw = (cmd.triggers || '').trim().split(/\s+/).filter(Boolean);
  if (!raw.length && cmd.name) raw.push(cmd.name);
  if (cmd.autoExclaim !== false) return raw.map(t => '!' + t.toLowerCase());
  return raw.map(t => t.toLowerCase());
}

function checkTrigger(text) {
  if (!config) return;

  const msgLower = text.trim().toLowerCase();

  (config.commands || []).forEach(cmd => {
    if (cmd.enabled === false) return;

    const triggers = buildTriggers(cmd);

    for (const trigger of triggers) {
      const matched = cmd.wildcards ? msgLower.startsWith(trigger) : msgLower.split(/\s+/)[0] === trigger;
      if (!matched) continue;

      setStatus('▶ command: ' + cmd.name);

      (cmd.actions || []).forEach(action => {
        if (action.type !== 'sound' && action.type !== 'overlay') return;
        setTimeout(() => runAction(action), Number(action.delay) || 0);
      });

      break;
    }
  });
}

function startIRC() {
  if (!config || !config.channel) return setStatus('missing channel/config');

  if (socket) {
    try { socket.close(); } catch (e) {}
  }

  setStatus('connecting anonymously to #' + config.channel + '...');

  socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  socket.onopen = () => {
    socket.send('PASS SCHMOOPIIE');
    socket.send('NICK justinfan' + Math.floor(Math.random() * 999999));
    socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    socket.send('JOIN #' + config.channel);
  };

  socket.onmessage = e => {
    const lines = e.data.split('\r\n').filter(Boolean);

    for (const line of lines) {
      if (line.startsWith('PING')) {
        socket.send('PONG :tmi.twitch.tv');
        continue;
      }

      let rest = line;
      if (line.startsWith('@')) rest = line.substring(line.indexOf(' ') + 1);

      const parts = rest.split(' ');
      if (parts[0] && parts[0].startsWith(':')) parts.shift();

      const cmd = parts.shift();
      const params = parts.join(' ');

      if (cmd === '001' || cmd === '376' || cmd === 'JOIN') setStatus('✓ connected to #' + config.channel);

      if (cmd === 'PRIVMSG') {
        const match = params.match(/^#\S+ :(.*)/);
        if (match) checkTrigger(match[1]);
      }
    }
  };

  socket.onclose = () => {
    setStatus('disconnected — reconnecting in 10s');
    setTimeout(startIRC, 10000);
  };

  socket.onerror = () => setStatus('websocket error');
}

document.getElementById('audio-unlock').addEventListener('click', unlockAudio);
document.addEventListener('click', unlockAudio, { once: true });

if (window.obsstudio) {
  window.obsstudio.onActiveChange = active => {
    if (active) unlockAudio();
  };
}

(async function boot() {
  try {
    config = await loadConfig();

    if (!config) return setStatus('no config found');
    if (!config.channel) return setStatus('config missing channel');

    setStatus('loaded #' + config.channel + ' / ' + ((config.commands || []).length) + ' command(s)');
    startIRC();
  } catch (err) {
    console.error(err);
    setStatus('startup error: ' + err.message);
  }
})();
</script>
</body>
</html>
