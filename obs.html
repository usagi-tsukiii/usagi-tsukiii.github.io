<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Usako – OBS Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
  .overlay-el { position: absolute; border-radius: 8px; max-width: 80vw; max-height: 80vh; pointer-events: none; }
</style>
</head>
<body>
<div id="container"></div>
<script>
  const STORE_KEY = 'usako_v1';
  const TRIGGER_KEY = 'usako_obs_trigger';
  let lastTimestamp = 0;

  function getMediaLib() {
    try {
      const s = localStorage.getItem(STORE_KEY);
      if (!s) return { sounds: [], overlays: [] };
      return JSON.parse(s).mediaLib || { sounds: [], overlays: [] };
    } catch(e) { return { sounds: [], overlays: [] }; }
  }

  function playSound(action) {
    const file = getMediaLib().sounds.find(s => s.id === action.fileId);
    if (!file) return;
    const audio = new Audio(file.b64);
    audio.volume = action.volume !== undefined ? Math.min(1, Math.max(0, action.volume)) : 1;
    audio.play().catch(e => console.warn('OBS sound error:', e));
  }

  function showOverlay(action) {
    const file = getMediaLib().overlays.find(o => o.id === action.fileId);
    if (!file) return;
    const container = document.getElementById('container');
    const el = file.mime.startsWith('video') ? document.createElement('video') : document.createElement('img');
    el.src = file.b64;
    el.className = 'overlay-el';
    if (action.width) el.style.width = action.width + 'px';
    const pos = action.position || 'center';
    if (pos === 'center')        Object.assign(el.style, { top:'50%', left:'50%', transform:'translate(-50%,-50%)' });
    else if (pos === 'top-left')      Object.assign(el.style, { top:'20px', left:'20px' });
    else if (pos === 'top-right')     Object.assign(el.style, { top:'20px', right:'20px' });
    else if (pos === 'bottom-left')   Object.assign(el.style, { bottom:'20px', left:'20px' });
    else if (pos === 'bottom-right')  Object.assign(el.style, { bottom:'20px', right:'20px' });
    else if (pos === 'top-center')    Object.assign(el.style, { top:'20px', left:'50%', transform:'translateX(-50%)' });
    else if (pos === 'bottom-center') Object.assign(el.style, { bottom:'20px', left:'50%', transform:'translateX(-50%)' });
    if (el.tagName === 'VIDEO') { el.autoplay = true; el.muted = false; el.loop = action.duration === 0; }
    container.appendChild(el);
    const dur = action.duration || 3000;
    if (dur > 0) setTimeout(() => el.remove(), dur);
  }

  function execAction(action) {
    const delay = action.delay || 0;
    if (action.type === 'sound')   setTimeout(() => playSound(action), delay);
    if (action.type === 'overlay') setTimeout(() => showOverlay(action), delay);
  }

  // Poll localStorage every 200ms for new triggers
  setInterval(() => {
    try {
      const raw = localStorage.getItem(TRIGGER_KEY);
      if (!raw) return;
      const payload = JSON.parse(raw);
      if (!payload || payload.t <= lastTimestamp) return;
      lastTimestamp = payload.t;
      execAction(payload.action);
    } catch(e) {}
  }, 200);

  // Also listen for storage events (works when both pages are in same browser)
  window.addEventListener('storage', (e) => {
    if (e.key !== TRIGGER_KEY || !e.newValue) return;
    try {
      const payload = JSON.parse(e.newValue);
      if (!payload || payload.t <= lastTimestamp) return;
      lastTimestamp = payload.t;
      execAction(payload.action);
    } catch(e) {}
  });

  console.log('Usako OBS overlay ready.');
</script>
</body>
</html>
