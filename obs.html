<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Usako OBS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
  .overlay-el { position: absolute; border-radius: 8px; max-width: 80vw; max-height: 80vh; pointer-events: none; }
</style>
</head>
<body>
<div id="container"></div>
<script>
  const STORE_KEY = 'usako_v1';

  function loadState() {
    try {
      const s = localStorage.getItem(STORE_KEY);
      return s ? JSON.parse(s) : null;
    } catch(e) { return null; }
  }

  function buildTriggers(cmd) {
    const raw = (cmd.triggers || '').trim().split(/\s+/).filter(Boolean);
    if (!raw.length) raw.push(cmd.name);
    if (cmd.autoExclaim !== false) return raw.map(t => '!' + t.toLowerCase());
    return raw.map(t => t.toLowerCase());
  }

  function playSound(action, mediaLib) {
    const file = mediaLib.sounds.find(s => s.id === action.fileId);
    if (!file) return;
    const audio = new Audio(file.b64);
    audio.volume = action.volume !== undefined ? Math.min(1, Math.max(0, action.volume)) : 1;
    audio.play().catch(e => console.warn('sound error:', e));
  }

  function showOverlay(action, mediaLib) {
    const file = mediaLib.overlays.find(o => o.id === action.fileId);
    if (!file) return;
    const container = document.getElementById('container');
    const el = file.mime.startsWith('video') ? document.createElement('video') : document.createElement('img');
    el.src = file.b64;
    el.className = 'overlay-el';
    if (action.width) el.style.width = action.width + 'px';
    const pos = action.position || 'center';
    if (pos === 'center')             Object.assign(el.style, { top:'50%', left:'50%', transform:'translate(-50%,-50%)' });
    else if (pos === 'top-left')      Object.assign(el.style, { top:'20px', left:'20px' });
    else if (pos === 'top-right')     Object.assign(el.style, { top:'20px', right:'20px' });
    else if (pos === 'bottom-left')   Object.assign(el.style, { bottom:'20px', left:'20px' });
    else if (pos === 'bottom-right')  Object.assign(el.style, { bottom:'20px', right:'20px' });
    else if (pos === 'top-center')    Object.assign(el.style, { top:'20px', left:'50%', transform:'translateX(-50%)' });
    else if (pos === 'bottom-center') Object.assign(el.style, { bottom:'20px', left:'50%', transform:'translateX(-50%)' });
    if (el.tagName === 'VIDEO') { el.autoplay = true; el.muted = false; el.loop = action.duration === 0; }
    container.appendChild(el);
    const dur = action.duration || 3000;
    if (dur > 0) setTimeout(() => el.remove(), dur);
  }

  function runCommand(cmd, state) {
    (cmd.actions || []).forEach(action => {
      if (action.type !== 'sound' && action.type !== 'overlay') return;
      setTimeout(() => {
        if (action.type === 'sound') playSound(action, state.mediaLib);
        if (action.type === 'overlay') showOverlay(action, state.mediaLib);
      }, action.delay || 0);
    });
  }

  function checkTrigger(text, state) {
    const msgLower = text.trim().toLowerCase();
    (state.commands || []).forEach(cmd => {
      if (cmd.enabled === false) return;
      const triggers = buildTriggers(cmd);
      for (const trigger of triggers) {
        let matched = false;
        if (cmd.wildcards) {
          matched = msgLower.startsWith(trigger);
        } else {
          matched = msgLower.split(/\s+/)[0] === trigger;
        }
        if (matched) { runCommand(cmd, state); break; }
      }
    });
  }

  // ── IRC ──────────────────────────────────────────────────────────────────────
  let socket = null;

  function connect() {
    const state = loadState();
    if (!state || !state.streamer) {
      console.warn('OBS: no streamer in localStorage, retrying in 5s...');
      setTimeout(connect, 5000);
      return;
    }

    const channel = state.streamer.name;
    const sender = state.bot || state.streamer;
    const token = sender.token;
    const nick = sender.name;

    console.log('OBS: connecting to #' + channel);
    socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

    socket.onopen = () => {
      if (token) {
        socket.send('PASS oauth:' + token);
        socket.send('NICK ' + nick);
      } else {
        socket.send('PASS SCHMOOPIIE');
        socket.send('NICK justinfan' + Math.floor(Math.random() * 99999));
      }
      socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      socket.send('JOIN #' + channel);
      console.log('OBS: joined #' + channel);
    };

    socket.onmessage = (e) => {
      const lines = e.data.split('\r\n').filter(Boolean);
      lines.forEach(line => {
        if (line.startsWith('PING')) { socket.send('PONG :tmi.twitch.tv'); return; }
        let tags = {}, rest = line;
        if (line.startsWith('@')) {
          const sp = line.indexOf(' ');
          line.substring(1, sp).split(';').forEach(t => { const [k,v] = t.split('='); tags[k] = v || ''; });
          rest = line.substring(sp + 1);
        }
        const parts = rest.split(' ');
        if (parts[0].startsWith(':')) parts.shift();
        const cmd = parts.shift();
        const params = parts.join(' ');
        if (cmd === 'PRIVMSG') {
          const msgMatch = params.match(/^#\S+ :(.*)/);
          const text = msgMatch ? msgMatch[1] : '';
          const freshState = loadState();
          if (freshState) checkTrigger(text, freshState);
        }
      });
    };

    socket.onclose = () => {
      console.warn('OBS: disconnected, reconnecting in 10s...');
      setTimeout(connect, 10000);
    };

    socket.onerror = (e) => {
      console.error('OBS: websocket error', e);
    };
  }

  // Unlock audio context for OBS (OBS triggers an interaction on scene activation)
  // Pre-create and resume AudioContext so audio plays without gesture
  function unlockAudio() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    // Play a silent buffer to fully unlock
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    console.log('OBS: audio context unlocked');
  }

  // Unlock audio via OBS scene activation hook
  if (window.obsstudio) {
    window.obsstudio.onActiveChange = function(active) {
      if (active) { try { unlockAudio(); } catch(e) {} }
    };
  }
  // Also try immediately and on any click
  try { unlockAudio(); } catch(e) {}
  document.addEventListener('click', unlockAudio, { once: true });

  connect();
</script>
</body>
</html>
