<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Usako OBS Source</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  .overlay-el {
    position: absolute;
    border-radius: 8px;
    max-width: 80vw;
    max-height: 80vh;
    pointer-events: none;
    z-index: 10;
  }
  #status {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-family: monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    background: rgba(0,0,0,0.35);
    padding: 6px 8px;
    border-radius: 6px;
    pointer-events: none;
    z-index: 9999;
  }
  #audio-unlock {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: rgba(0,0,0,0.75);
    color: white;
    font-family: sans-serif;
    place-items: center;
    text-align: center;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="container"></div>
<div id="status">Usako OBS — loading...</div>
<div id="audio-unlock">Click once to enable audio preview<br><small>OBS/Streamlabs usually do not need this.</small></div>

<script>
  const STORE_KEY = 'usako_v1';
  const OBS_KEY = 'usako_obs_config';

  let config = null;
  let socket = null;
  let lastTriggerTime = 0;

  function setStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = 'Usako OBS — ' + msg;
    console.log('[Usako OBS]', msg);
  }

  function base64UrlDecode(str) {
    const padded = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4);
    const binary = atob(padded);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function normalizeConfig(raw) {
    if (!raw) return null;

    if (raw.streamer) {
      return {
        channel: raw.streamer.name,
        commands: raw.commands || [],
        mediaLib: raw.mediaLib || { sounds: [], overlays: [] }
      };
    }

    return {
      channel: raw.channel || '',
      commands: raw.commands || [],
      mediaLib: raw.mediaLib || { sounds: [], overlays: [] }
    };
  }

  function loadConfig() {
    const params = new URLSearchParams(location.search);

    try {
      if (params.get('cfg')) {
        return normalizeConfig(JSON.parse(base64UrlDecode(params.get('cfg'))));
      }
    } catch (e) {
      setStatus('URL config error: ' + e.message);
    }

    try {
      const s = localStorage.getItem(STORE_KEY);
      if (s) return normalizeConfig(JSON.parse(s));
    } catch (e) {}

    try {
      const s = localStorage.getItem(OBS_KEY);
      if (s) return normalizeConfig(JSON.parse(s));
    } catch (e) {}

    const channel = params.get('channel');
    if (channel) {
      return normalizeConfig({
        channel,
        commands: [],
        mediaLib: { sounds: [], overlays: [] }
      });
    }

    return null;
  }

  function refreshConfigFromPayload(payload) {
    if (payload && payload.state) {
      config = normalizeConfig(payload.state);
      return;
    }

    const fresh = loadConfig();
    if (fresh) config = fresh;
  }

  function getMediaSource(file) {
    return file.url || file.b64 || file.src || '';
  }

  function playSound(action) {
    refreshConfigFromPayload();

    const sounds = (config && config.mediaLib && config.mediaLib.sounds) || [];
    const file = sounds.find(s => String(s.id) === String(action.fileId));

    if (!file) {
      setStatus('sound not found: ' + action.fileId);
      return;
    }

    const src = getMediaSource(file);
    if (!src) {
      setStatus('sound has no url/b64');
      return;
    }

    try {
      const audio = new Audio(src);
      audio.volume = action.volume !== undefined
        ? Math.min(1, Math.max(0, parseFloat(action.volume)))
        : 1;

      const p = audio.play();

      if (p && p.catch) {
        p.then(() => setStatus('♪ playing sound: ' + (file.name || file.id)))
         .catch(e => {
           setStatus('sound blocked: click to enable audio');
           showAudioUnlock();
           console.error(e);
         });
      }
    } catch (e) {
      setStatus('sound error: ' + e.message);
    }
  }

  function showOverlay(action) {
    refreshConfigFromPayload();

    const overlays = (config && config.mediaLib && config.mediaLib.overlays) || [];
    const file = overlays.find(o => String(o.id) === String(action.fileId));

    if (!file) {
      setStatus('overlay not found: ' + action.fileId);
      return;
    }

    const src = getMediaSource(file);
    if (!src) {
      setStatus('overlay has no url/b64');
      return;
    }

    const container = document.getElementById('container');
    const mime = file.mime || '';
    const el = mime.startsWith('video') ? document.createElement('video') : document.createElement('img');

    el.src = src;
    el.className = 'overlay-el';

    if (action.width && Number(action.width) > 0) {
      el.style.width = action.width + 'px';
    }

    const pos = action.position || 'center';

    if (pos === 'center')             Object.assign(el.style, { top:'50%', left:'50%', transform:'translate(-50%,-50%)' });
    else if (pos === 'top-left')      Object.assign(el.style, { top:'20px', left:'20px' });
    else if (pos === 'top-right')     Object.assign(el.style, { top:'20px', right:'20px' });
    else if (pos === 'bottom-left')   Object.assign(el.style, { bottom:'20px', left:'20px' });
    else if (pos === 'bottom-right')  Object.assign(el.style, { bottom:'20px', right:'20px' });
    else if (pos === 'top-center')    Object.assign(el.style, { top:'20px', left:'50%', transform:'translateX(-50%)' });
    else if (pos === 'bottom-center') Object.assign(el.style, { bottom:'20px', left:'50%', transform:'translateX(-50%)' });

    el.onerror = () => setStatus('overlay failed to load');
    el.onload = () => setStatus('🖼 showing overlay: ' + (file.name || file.id));

    if (el.tagName === 'VIDEO') {
      el.autoplay = true;
      el.muted = false;
      el.loop = action.duration === 0;
      el.playsInline = true;
      el.onloadeddata = () => setStatus('🎬 showing video: ' + (file.name || file.id));
      el.play().catch(e => {
        setStatus('video play blocked: click to enable');
        showAudioUnlock();
        console.error(e);
      });
    }

    container.appendChild(el);

    const dur = action.duration !== undefined ? Number(action.duration) : 3000;
    if (dur > 0) setTimeout(() => el.remove(), dur);
  }

  function runAction(action) {
    if (!action || !action.type) return;
    if (action.type === 'sound') playSound(action);
    if (action.type === 'overlay') showOverlay(action);
  }

  function receivePayload(payload) {
    if (!payload || !payload.action) return;
    if (payload.t && payload.t <= lastTriggerTime) return;

    lastTriggerTime = payload.t || Date.now();
    refreshConfigFromPayload(payload);
    runAction(payload.action);
  }

  window.addEventListener('storage', e => {
    if (e.key !== 'usako_obs_trigger' || !e.newValue) return;

    try {
      receivePayload(JSON.parse(e.newValue));
    } catch (err) {
      setStatus('trigger parse error: ' + err.message);
    }
  });

  try {
    const bc = new BroadcastChannel('usako_obs');
    bc.onmessage = e => receivePayload(e.data);
  } catch (e) {}

  setInterval(() => {
    try {
      const s = localStorage.getItem('usako_obs_trigger');
      if (s) receivePayload(JSON.parse(s));
    } catch (e) {}
  }, 750);

  function buildTriggers(cmd) {
    const raw = (cmd.triggers || '').trim().split(/\s+/).filter(Boolean);
    if (!raw.length && cmd.name) raw.push(cmd.name);
    if (cmd.autoExclaim !== false) return raw.map(t => '!' + t.toLowerCase());
    return raw.map(t => t.toLowerCase());
  }

  function checkTrigger(text) {
    if (!config) return;

    const msgLower = text.trim().toLowerCase();

    (config.commands || []).forEach(cmd => {
      if (cmd.enabled === false) return;

      const triggers = buildTriggers(cmd);

      for (const trigger of triggers) {
        const matched = cmd.wildcards
          ? msgLower.startsWith(trigger)
          : msgLower.split(/\s+/)[0] === trigger;

        if (!matched) continue;

        setStatus('▶ command: ' + cmd.name);

        (cmd.actions || []).forEach(action => {
          if (action.type !== 'sound' && action.type !== 'overlay') return;
          setTimeout(() => runAction(action), action.delay || 0);
        });

        break;
      }
    });
  }

  function startIRC() {
    if (!config || !config.channel) {
      setStatus('missing channel/config');
      return;
    }

    if (socket) {
      try { socket.close(); } catch (e) {}
    }

    setStatus('connecting to #' + config.channel + '...');

    socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

    socket.onopen = () => {
      socket.send('PASS SCHMOOPIIE');
      socket.send('NICK justinfan' + Math.floor(Math.random() * 99999));
      socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      socket.send('JOIN #' + config.channel);
    };

    socket.onmessage = e => {
      const lines = e.data.split('\r\n').filter(Boolean);

      lines.forEach(line => {
        if (line.startsWith('PING')) {
          socket.send('PONG :tmi.twitch.tv');
          return;
        }

        let rest = line;

        if (line.startsWith('@')) {
          const sp = line.indexOf(' ');
          rest = line.substring(sp + 1);
        }

        const parts = rest.split(' ');
        if (parts[0] && parts[0].startsWith(':')) parts.shift();

        const cmd = parts.shift();
        const params = parts.join(' ');

        if (cmd === '001' || cmd === '376' || cmd === 'JOIN') {
          setStatus('✓ connected to #' + config.channel);
        }

        if (cmd === 'PRIVMSG') {
          const m = params.match(/^#\S+ :(.*)/);
          if (m) checkTrigger(m[1]);
        }
      });
    };

    socket.onclose = () => {
      setStatus('disconnected — reconnecting in 10s...');
      setTimeout(startIRC, 10000);
    };

    socket.onerror = () => setStatus('websocket error');
  }

  function showAudioUnlock() {
    const el = document.getElementById('audio-unlock');
    el.style.display = 'grid';
  }

  function unlockAudio() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();

      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();

      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) {}

    document.getElementById('audio-unlock').style.display = 'none';
  }

  document.getElementById('audio-unlock').addEventListener('click', unlockAudio);
  document.addEventListener('click', unlockAudio, { once: true });

  if (window.obsstudio) {
    window.obsstudio.onActiveChange = active => {
      if (active) unlockAudio();
    };
  }

  try {
    config = loadConfig();

    if (config) {
      setStatus('loaded config for #' + config.channel);
      startIRC();
    } else {
      setStatus('no config found');
    }
  } catch (e) {
    setStatus('startup error: ' + e.message);
    console.error(e);
  }
</script>
</body>
</html>
